<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="booking.meta.title">Your booking - GoodDayBus</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🚌</text></svg>'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .ic{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-.125em;flex-shrink:0}
        :root{
            --orange:#F06422;--orange-2:#D95818;--orange-bg:#FFF5EE;--orange-brd:rgba(240,100,34,0.18);
            --blue:#1A6DB5;--text:#1A2332;--text-2:#5E6E80;--text-3:#647585;
            --border:#E0E8F0;--bg:#F7F9FC;--white:#FFFFFF;
            --green:#1A9E5E;--green-bg:#EDFBF3;--red:#D93025;--red-bg:#FDECEA;
            --amber:#C77700;--amber-bg:#FFF6E5;--gray:#5E6E80;--gray-bg:#EEF2F6;
            --r-xl:22px;--r-lg:14px;--r:10px;--r-sm:7px;
            --sh-sm:0 2px 8px rgba(26,35,50,0.06);--sh-md:0 8px 28px rgba(26,35,50,0.10);--sh-lg:0 20px 60px rgba(26,35,50,0.13);
            --tr:all 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{overflow-x:hidden}
        body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
        .hidden{display:none!important}

        header{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;box-shadow:var(--sh-sm);position:sticky;top:0;z-index:20}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
        .logo-icon{width:34px;height:34px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
        .logo-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:500}
        .logo-name span{color:var(--orange)}

        .wrap{max-width:480px;margin:0 auto;padding:22px 16px 48px}
        .page-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;margin-bottom:16px}

        .card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:20px;margin-bottom:14px}

        /* Loading */
        #loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--text-3);font-weight:700}
        .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Status badge */
        .status-badge{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:12px 14px;font-weight:800;font-size:14px;margin-bottom:18px}
        .status-badge.status-ok{background:var(--green-bg);color:var(--green)}
        .status-badge.status-pending{background:var(--amber-bg);color:var(--amber)}
        .status-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}

        .route-row{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin-bottom:16px;flex-wrap:wrap}
        .route-row .sep{color:var(--orange)}

        .info-list{display:flex;flex-direction:column;gap:11px}
        .info-row{display:flex;align-items:flex-start;gap:10px;font-size:14px}
        .info-row .ic{color:var(--orange);font-size:15px;margin-top:2px}
        .info-row .info-lbl{color:var(--text-3);font-weight:700;flex:0 0 88px}
        .info-row .info-val{color:var(--text);font-weight:700;flex:1}

        .card h2{font-size:14px;font-weight:800;color:var(--text-2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .card h2 .ic{color:var(--orange)}

        .pax-list{display:flex;flex-direction:column;gap:9px}
        .pax-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
        .pax-name{font-weight:700}
        .pax-seat{font-size:12px;font-weight:800;color:var(--orange);background:var(--orange-bg);border-radius:50px;padding:2px 10px;white-space:nowrap}
        .pax-phone{font-size:12.5px;color:var(--text-2);text-decoration:none}
        .pax-phone:hover{color:var(--orange)}

        .tickets-list{display:flex;flex-direction:column;gap:10px}
        .ticket-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;background:var(--orange);color:#fff;text-decoration:none;border-radius:var(--r);font-weight:800;font-size:14px;padding:10px 14px;transition:var(--tr)}
        .ticket-btn:hover{background:var(--orange-2)}
        .tickets-note{font-size:13px;color:var(--text-2);background:var(--bg);border-radius:var(--r-sm);padding:11px 13px}

        .contact-buttons{display:flex;flex-direction:column;gap:10px}
        .cbtn{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:var(--r);padding:10px 16px;font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--border);color:var(--text);transition:var(--tr)}
        .cbtn .ic{font-size:18px}
        .cbtn:hover{border-color:currentColor}
        .cbtn-tg{color:#2b9fd5}
        .cbtn-vb{color:#7360f2}
        .cbtn-wa{color:#25d366}
        .cbtn-phone{color:var(--orange)}

        .err-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px}
        .err-card .ic{font-size:34px;color:var(--red)}
        .err-card p{font-size:14px;color:var(--text-2);font-weight:600}
    </style>
</head>
<body>

<header>
    <a href="/en/" class="logo">
        <div class="logo-icon"><svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-bus"></use></svg></div>
        <span class="logo-name">Goodday<span>Bus</span></span>
    </a>
</header>

<div class="wrap">
    <h1 class="page-title" data-i18n="booking.pageTitle">Your booking</h1>

    <div id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <span data-i18n="booking.loading">Loading your booking...</span>
    </div>

    <div id="error-state" class="hidden">
        <div class="card err-card">
            <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-triangle-exclamation"></use></svg>
            <p data-i18n="booking.notFound">Booking not found. Check the link or message us.</p>
        </div>
    </div>

    <div id="content" class="hidden">
        <div class="card">
            <div id="status-badge" class="status-badge"></div>
            <div class="route-row">
                <span id="route-from"></span>
                <span class="sep">→</span>
                <span id="route-to"></span>
            </div>
            <div class="info-list">
                <div class="info-row">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-calendar"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.date">Date</span>
                    <span class="info-val" id="route-date"></span>
                </div>
                <div class="info-row" id="row-carrier">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-bus"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.carrier">Carrier</span>
                    <span class="info-val" id="route-carrier"></span>
                </div>
                <div class="info-row" id="row-price">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-money-bill-wave"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.price">Price</span>
                    <span class="info-val" id="route-price"></span>
                </div>
                <div class="info-row" id="row-from-station">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-location-dot"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.boarding">Boarding</span>
                    <span class="info-val" id="route-from-station"></span>
                </div>
                <div class="info-row" id="row-to-station">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-flag-checkered"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.dropoff">Drop-off</span>
                    <span class="info-val" id="route-to-station"></span>
                </div>
                <div class="info-row" id="row-seats">
                    <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-chair"></use></svg>
                    <span class="info-lbl" data-i18n="booking.labels.seats">Seats</span>
                    <span class="info-val" id="route-seats"></span>
                </div>
            </div>
        </div>

        <div class="card hidden" id="pax-card">
            <h2 data-i18n-html="booking.paxHeading"><svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-users"></use></svg> Passengers</h2>
            <div class="pax-list" id="pax-list"></div>
        </div>

        <div class="card hidden" id="tickets-card">
            <h2 data-i18n-html="booking.ticketsHeading"><svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-ticket"></use></svg> Tickets</h2>
            <div class="tickets-list" id="tickets-list"></div>
            <div class="tickets-note hidden" id="tickets-note"></div>
        </div>
    </div>

    <div class="card">
        <h2 data-i18n-html="booking.contactHeading"><svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-headset"></use></svg> Contact us</h2>
        <div class="contact-buttons">
            <a class="cbtn cbtn-tg" href="https://t.me/gooddaybus" target="_blank" rel="noopener">
                <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-telegram"></use></svg> Telegram
            </a>
            <a class="cbtn cbtn-vb" href="viber://chat?number=%2B380967656732">
                <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-viber"></use></svg> Viber
            </a>
            <a class="cbtn cbtn-wa" href="https://wa.me/380967656732" target="_blank" rel="noopener">
                <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-whatsapp"></use></svg> WhatsApp
            </a>
            <a class="cbtn cbtn-phone" href="tel:+380967656732">
                <svg class="ic" aria-hidden="true"><use href="/_sprite.svg#i-phone"></use></svg> +38 (096) 765-67-32
            </a>
        </div>
    </div>
</div>

<script src="/i18n/en.js?v=f9ce28af3c"></script>
<script>
(function () {
    'use strict';

    // Український словник рядків, яких немає в розмітці (data-i18n не підходить - вони
    // формуються в коді). B - активний словник: на англійській сторінці build-i18n.js
    // підставляє /i18n/en.js ПЕРЕД цим скриптом, і window.__I18N__.booking переважає B_UK
    // (той самий прийом, що й T/C у common.js). На українській сторінці window.__I18N__
    // відсутній, тож B === B_UK і поведінка не змінюється.
    var B_UK = {
        months: ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
            'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'],
        paxFallback: 'Пасажир',
        seatLabel: 'Місце ',
        downloadTicket: 'Завантажити квиток ',
        ticketsNote: 'Квитки надішле менеджер найближчим часом',
        statusBooked: 'Місця заброньовано - оплата водієві при посадці',
        statusPending: 'Заявку прийнято - менеджер звʼяжеться з вами'
    };
    var B = (window.__I18N__ && window.__I18N__.booking) || B_UK;

    // Дані заявки зберігаються українською навмисно - їх читає україномовний менеджер.
    // На англійській сторінці перекладаємо їх ЛИШЕ для показу. id міста тут недоступний
    // (ні відповідь API, ні таблиця orders його не тримають), тому мапа - за назвою;
    // чого в ній немає - транслітеруємо, що для українських міст і є правильний результат.
    var I18N = window.__I18N__ || null;
    var isEn = document.documentElement.lang === 'en';

    function trCity(name) {
        if (!isEn || !name) return name;
        var byName = I18N && I18N.cityByName;
        if (byName && Object.prototype.hasOwnProperty.call(byName, name)) return byName[name];
        return typeof window.translit === 'function' ? window.translit(name) : name;
    }

    function trCarrier(name) {
        if (!isEn || !name) return name;
        if (window.vendorEn && typeof window.vendorEn.carrierName === 'function') {
            return window.vendorEn.carrierName(name).text;
        }
        return name;
    }

    // Адреса зупинки: службові слова - зі словника, решта - транслітерація.
    // Заміна ПО МЕЖАХ СЛІВ і без урахування регістру: інакше "вокзал" усередині
    // "Автовокзал" дає "Avtostation", а станцію метро "Вокзальна" ріже навпіл.
    function trStation(text) {
        if (!isEn || !text) return text;
        var geo = I18N && I18N.geo;
        var out = String(text);
        if (geo) {
            var cyr = 'А-Яа-яІіЇїЄєҐґ';
            Object.keys(geo).sort(function (a, b) { return b.length - a.length; }).forEach(function (k) {
                var esc = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                out = out.replace(new RegExp('(^|[^' + cyr + '])' + esc + '(?![' + cyr + '])', 'gi'),
                    function (m, p) { return p + geo[k]; });
            });
        }
        return typeof window.translit === 'function' ? window.translit(out) : out;
    }

    function formatDate(iso) {
        var s = String(iso || '');
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);          // YYYY-MM-DD (старі/тестові записи)
        if (!m) {
            var d = /^(\d{2})\.(\d{2})\.(\d{4})/.exec(s);    // DD.MM.YYYY (реальні заявки з сайту)
            if (d) m = [d[0], d[3], d[2], d[1]];
            else return s;
        }
        var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), day = parseInt(m[3], 10);
        if (!mo || mo < 1 || mo > 12) return s;
        return day + ' ' + B.months[mo - 1] + ' ' + y;
    }

    function $(id) { return document.getElementById(id); }

    function showState(id) {
        ['loading', 'error-state', 'content'].forEach(function (s) {
            $(s).classList.toggle('hidden', s !== id);
        });
    }

    function setRow(rowId, valueId, text) {
        var row = $(rowId), val = $(valueId);
        if (text) {
            val.textContent = text;
            row.classList.remove('hidden');
        } else {
            row.classList.add('hidden');
        }
    }

    function renderPassengers(order) {
        var card = $('pax-card'), list = $('pax-list');
        list.textContent = '';
        var pax = Array.isArray(order.passengers) ? order.passengers : [];
        if (!pax.length) { card.classList.add('hidden'); return; }
        pax.forEach(function (p) {
            var item = document.createElement('div');
            item.className = 'pax-item';

            // Left column: name and phone
            var leftCol = document.createElement('div');
            leftCol.style.display = 'flex';
            leftCol.style.flexDirection = 'column';
            leftCol.style.gap = '4px';

            var name = document.createElement('span');
            name.className = 'pax-name';
            var fullName = [p.first_name, p.last_name].filter(Boolean).join(' ');
            name.textContent = fullName || B.paxFallback;
            leftCol.appendChild(name);

            // Add phone if present
            if (p.phone) {
                var phone = document.createElement('a');
                phone.className = 'pax-phone';
                var cleanPhone = String(p.phone).replace(/[^+\d]/g, '');
                phone.setAttribute('href', 'tel:' + cleanPhone);
                phone.textContent = p.phone;
                leftCol.appendChild(phone);
            }

            item.appendChild(leftCol);

            // Right: seat
            if (p.seat_name) {
                var seat = document.createElement('span');
                seat.className = 'pax-seat';
                seat.textContent = B.seatLabel + p.seat_name;
                item.appendChild(seat);
            }
            list.appendChild(item);
        });
        card.classList.remove('hidden');
    }

    function renderTickets(order, token) {
        var card = $('tickets-card'), list = $('tickets-list'), note = $('tickets-note');
        list.textContent = '';
        note.classList.add('hidden');
        note.textContent = '';
        var tickets = Array.isArray(order.tickets) ? order.tickets : [];
        if (tickets.length) {
            tickets.forEach(function (tk, i) {
                var a = document.createElement('a');
                a.className = 'ticket-btn';
                a.href = '/api/booking/' + encodeURIComponent(token) + '/ticket/' + encodeURIComponent(tk.id);
                a.textContent = B.downloadTicket + (i + 1);
                list.appendChild(a);
            });
            card.classList.remove('hidden');
        } else if (order.booked) {
            note.textContent = B.ticketsNote;
            note.classList.remove('hidden');
            card.classList.remove('hidden');
        } else {
            card.classList.add('hidden');
        }
    }

    function render(order, token) {
        var badge = $('status-badge');
        badge.textContent = '';
        badge.className = 'status-badge ' + (order.booked ? 'status-ok' : 'status-pending');
        var dot = document.createElement('span');
        dot.className = 'status-dot';
        badge.appendChild(dot);
        var txt = document.createElement('span');
        txt.textContent = order.booked
            ? B.statusBooked
            : B.statusPending;
        badge.appendChild(txt);

        $('route-from').textContent = trCity(order.route_from || '');
        $('route-to').textContent = trCity(order.route_to || '');

        var dateText = formatDate(order.route_date);
        if (order.route_time) dateText += ', ' + order.route_time;
        $('route-date').textContent = dateText;

        setRow('row-carrier', 'route-carrier', trCarrier(order.route_carrier));
        setRow('row-price', 'route-price', order.route_price);
        setRow('row-from-station', 'route-from-station', trStation(order.route_from_station));
        setRow('row-to-station', 'route-to-station', trStation(order.route_to_station));
        setRow('row-seats', 'route-seats', order.seats ? String(order.seats) : '');

        renderPassengers(order);
        renderTickets(order, token);
    }

    function load() {
        var token = location.pathname.split('/').pop();
        if (!/^[a-f0-9]{32}$/.test(token)) { showState('error-state'); return; }
        fetch('/api/booking/' + encodeURIComponent(token))
            .then(function (r) {
                return r.json().catch(function () { return null; }).then(function (data) {
                    return { ok: r.ok, data: data };
                });
            })
            .then(function (res) {
                if (!res.ok || !res.data || !res.data.ok || !res.data.order) {
                    showState('error-state');
                    return;
                }
                render(res.data.order, token);
                showState('content');
            })
            .catch(function () { showState('error-state'); });
    }

    load();
})();
</script>
</body>
</html>
